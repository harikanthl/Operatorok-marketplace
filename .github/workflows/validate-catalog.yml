name: validate-catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Shape of the index and every local plugin; then every remote source fetched at its pinned
      # SHA and verified to be that SHA. A pin that no longer resolves fails here, loudly.
      - run: python3 scripts/validate_catalog.py --fetch
      # The component index is generated; a PR that changes a plugin without regenerating it fails.
      - run: python3 scripts/generate_plugin_index.py --check
